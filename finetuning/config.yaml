# ==========================================================================
# Configurazione finetuning modello ibrido LLaMA + 2-Simplicial
# ==========================================================================

# Modello
model_name: "meta-llama/Llama-3.2-1B"
attention_type: "simplicial"    # "simplicial" | "gram_det"
simplicial_indices: [7, 9, 11, 13]
alpha: 0.001
w1: 64
w2: 256
gram_window: 2
use_triton: true

# Dataset
dataset_name: "allenai/c4"
dataset_config: "en"
seq_length: 512
val_dataset: "wikitext"
val_dataset_config: "wikitext-2-raw-v1"
val_samples: 500

# Training
max_steps: 10000
baseline_ppl: 12.67       # baseline PPL di LLaMA 3.2 1B su Wikitext-2 (calcolata con baseline_ppl.py)
per_device_batch_size: 16
gradient_accumulation_steps: 1
warmup_steps: 100

# Learning rates
lr_k2v2: 5.0e-4           # 2.5x rispetto a prima — K2/V2 partono da random noise, gradiente debole
lr_k1v1: 2.0e-5           # invariato — pesi pretrained, non vogliamo romperli
lr_standard: 5e-6          # learning rate per layer non-simpliciali (standard)
weight_decay: 0.01
beta1: 0.9
beta2: 0.95

# Monitoring
log_every: 10
val_every: 50
save_every: 2000  # ogni checkpoint ~17 GB, con 100 GB disco teniamo solo ultimi 2

# Early stopping
early_stop_ppl: 100         # stop se PPL > 100 nei primi step
max_perplexity_gap: 10.0   # legacy: gap PPL rispetto baseline

# Weights & Biases
wandb_project: "simplex-filters"
wandb_run_name: "llama-h100-w64-w256-triton-fwd-py-bwd"

# Checkpoint
checkpoint_dir: "./checkpoints"
