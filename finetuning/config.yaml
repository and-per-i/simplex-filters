# ==========================================================================
# Configurazione finetuning modello ibrido LLaMA + 2-Simplicial
# ==========================================================================

# Modello
model_name: "meta-llama/Llama-3.1-8B"
attention_type: "simplicial"    # "simplicial" | "gram_det"
simplicial_indices: [16, 20, 24, 28]
alpha: 0.01
w1: 32
w2: 256
gram_window: 2

# Dataset
dataset_name: "allenai/c4"
dataset_config: "en"
seq_length: 512
val_dataset: "wikitext"
val_dataset_config: "wikitext-2-raw-v1"
val_samples: 500

# Training
max_steps: 10000
per_device_batch_size: 1
gradient_accumulation_steps: 16
warmup_steps: 100

# Learning rates
lr_k2v2: 5.0e-4           # 2.5x rispetto a prima — K2/V2 partono da random noise, gradiente debole
lr_k1v1: 2.0e-5           # invariato — pesi pretrained, non vogliamo romperli
weight_decay: 0.01
beta1: 0.9
beta2: 0.95

# Monitoring
log_every: 10
val_every: 500
save_every: 2000  # ogni checkpoint ~17 GB, con 100 GB disco teniamo solo ultimi 2

# Early stopping (validation su C4, non su Wikitext-2)
# max_perplexity_gap: confronto con la baseline LLaMA su C4 (calcolata a inizio training)
# Durante il training, la PPL su C4 viene monitorata ma senza early stopping aggressivo
max_perplexity_gap: 10.0

# Weights & Biases
wandb_project: "simplex-filters"
wandb_run_name: "llama-simplicial-finetune-v2"

# Checkpoint
checkpoint_dir: "./checkpoints"
